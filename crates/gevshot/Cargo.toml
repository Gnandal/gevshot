[package]
name = "gevshot"
version.workspace = true
edition.workspace = true

[dependencies]
gev-core = { workspace = true, features = ["system-fonts"] }
arboard = "3.6.1"
base64.workspace = true
chrono = "0.4.45"
dirs = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
global-hotkey = "0.8.0"
image.workspace = true
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
tray-icon = "0.24.1"
ureq = { version = "2", features = ["json"] }
xcap = "0.9.6"

[build-dependencies]
winresource = "0.1"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["ico"] }
