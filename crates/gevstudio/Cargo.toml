[package]
name = "gevstudio"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gevstudio"
path = "src/main.rs"

[dependencies]
# Fontes embarquées : rendu déterministe des exports, indépendant de la machine.
gev-core = { workspace = true, features = ["embedded-fonts"] }
base64.workspace = true
dirs = "6.0.0"
ecolor.workspace = true
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { workspace = true, features = ["gif"] }
printpdf = { version = "0.11.2", features = ["png"] }
rfd = "0.17.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Nouvelles dépendances pour narration/vidéo
# rodio est optionnel car il dépend de système audio; dans ce remote env on simule
ureq = { version = "2", features = ["json"] }
# ffmpeg-sidecar pour l'export vidéo (sera utilisé en v1+)
# ffmpeg-sidecar = "2.5"

[dev-dependencies]
emath.workspace = true
rand = "0.8"

# Outil hors-ligne (vendeur) : génère la paire de clés et signe les licences.
[[example]]
name = "license_tool"
path = "examples/license_tool.rs"
