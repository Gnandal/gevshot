[workspace]
resolver = "3"
members = ["crates/gev-core", "crates/gev-ui", "crates/gevshot", "crates/gevstudio"]

[workspace.package]
version = "1.0.2"
edition = "2024"

[workspace.dependencies]
gev-core = { path = "crates/gev-core" }
gev-ui = { path = "crates/gev-ui" }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# emath/ecolor : mêmes types que ceux ré-exportés par egui — à maintenir
# sur la même version mineure qu'eframe.
emath = "0.35"
ecolor = "0.35"
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
dirs = "6.0.0"
rfd = "0.17.2"

[profile.release]
lto = true
strip = true
